# SPDX-License-Identifier: BSD-3-Clause
#
# HDA generic topology with a KPB-based Wake-on-Voice detection branch.
#
# On top of sof-hda-generic.tplg, this taps the Analog Capture DAI
# endpoint (module-copier.4.2) into a new capture branch:
#
#   module-copier.4.2 (48 kHz stereo)
#     -> SRC (48 -> 16 kHz stereo)
#     -> KPB (16 kHz stereo, dual sinks)
#          pin 0 -> micsel (stereo -> double mono)
#                  -> MFCC (40 mel compress)
#                  -> TFLM classifier
#                  -> host-copier: "HDA Mic TFLM Detect" PCM (stereo)
#          pin 1 -> host-copier: "HDA Mic WoV Capture" PCM (stereo)
#
# KPB is used in a Linux-compatible configuration (ibs == obs, no
# micselector mode); the topology-side micsel widget performs channel
# reduction on the detection path. The TFLM Detect PCM is exposed as
# stereo double-mono to work around HDA capture's mono restriction.
#
# Applies to all IPC4 HDA platforms.

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<vendor-token.conf>
<tokens.conf>
<output_pin_binding.conf>
<src-kpb-be.conf>
<host-gateway-micsel-mfcc-tflm-capture.conf>

Define {
	HDA_CONFIG			"mix"
	PLATFORM			"none"
	NUM_DMICS			0
	HDA_TFLM_KPB_PIPELINE_ID	40
	HDA_TFLM_WOV_PIPELINE_ID	41
	HDA_TFLM_WOV_PCM_ID		41
	HDA_TFLM_DETECT_PIPELINE_ID	42
	HDA_TFLM_DETECT_PCM_ID		42
	# MFCC compress output frame: 24-byte header + 40 mel bins * 4 bytes.
	MFCC_FRAME_BYTES		184
}

<sof-hda-generic.conf>

Object.Pipeline.src-kpb-be [
	{
		index $HDA_TFLM_KPB_PIPELINE_ID

		# KPB requires pin 0 (binding.1) to feed the detect/selector sink
		# and pin 1+ (binding.2) to feed the host drain; see kpb_bind().
		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "micsel.$HDA_TFLM_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "copier.host.$HDA_TFLM_WOV_PIPELINE_ID.1"
			}
		}
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index $HDA_TFLM_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "HDA Mic WoV Capture"
			pcm_id $HDA_TFLM_WOV_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_rate			16000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_rate		16000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Pipeline.host-gateway-micsel-mfcc-tflm-capture [
	{
		index $HDA_TFLM_DETECT_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "HDA Mic TFLM Detect"
			pcm_id $HDA_TFLM_DETECT_PCM_ID
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "HDA Mic TFLM Micsel bytes"
					<include/components/micsel/downmix_stereo_to_doublemono.conf>
				}
			}
		}

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "HDA Mic TFLM MFCC bytes"
					<include/components/mfcc/mel40_compress.conf>
				}
				mixer."1" {
					name "HDA Mic TFLM MFCC VAD"
				}
			}
		}
	}
]

Object.Base.route [
	{
		source "module-copier.4.2"
		sink "src.$HDA_TFLM_KPB_PIPELINE_ID.1"
	}
	{
		source "kpb.$HDA_TFLM_KPB_PIPELINE_ID.1"
		sink "host-copier.$HDA_TFLM_WOV_PCM_ID.capture"
	}
	{
		source "kpb.$HDA_TFLM_KPB_PIPELINE_ID.1"
		sink "micsel.$HDA_TFLM_DETECT_PIPELINE_ID.1"
	}
]

Object.PCM.pcm [
	{
		name "HDA Mic WoV Capture"
		id $HDA_TFLM_WOV_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "HDA Mic WoV Capture"
		}

		Object.PCM.pcm_caps.1 {
			name "HDA Mic WoV Capture"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
	{
		name "HDA Mic TFLM Detect"
		id $HDA_TFLM_DETECT_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "HDA Mic TFLM Detect"
		}

		Object.PCM.pcm_caps.1 {
			name "HDA Mic TFLM Detect"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
]
