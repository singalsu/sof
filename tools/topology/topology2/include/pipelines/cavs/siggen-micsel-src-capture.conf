#
# Echo reference pipeline for AEC
#
# siggen.1 (48 kHz stereo) -> micsel.1 (stereo to mono) -> src.1 (48 to 16 kHz)
#
# The siggen widget collects the speaker echo reference and the src output
# feeds the reference input pin of an echo canceller in another pipeline.
# All attributes defined herein are namespaced by alsatplg to
# "Object.Pipeline.siggen-micsel-src-capture.N.attribute_name".
#
# Usage: siggen-micsel-src-capture pipeline object can be instantiated as:
#
# Object.Pipeline.siggen-micsel-src-capture."N" {
#	Object.Widget.micsel.1 {
#		Object.Control.bytes."1" {
#			name "AEC reference micsel bytes"
#			<include/components/micsel/downmix_stereo_to_mono.conf>
#		}
#	}
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#
# The siggen, micsel and src widget classes must be included by the top level
# topology. Including siggen.conf again would duplicate its default format.
#

Class.Pipeline."siggen-micsel-src-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		# the 32-bit output format is the siggen class default
		siggen."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
		}

		micsel."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		$CHANNEL_MAP_STEREO
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_channels		1
					out_ch_cfg		$CHANNEL_CONFIG_MONO
					out_ch_map		$CHANNEL_MAP_MONO
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		src."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		1
					in_ch_cfg		$CHANNEL_CONFIG_MONO
					in_ch_map		$CHANNEL_MAP_MONO
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		1
					out_ch_cfg		$CHANNEL_CONFIG_MONO
					out_ch_map		$CHANNEL_MAP_MONO
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base {
		!route [
			{
				source	siggen.$index.1
				sink	micsel.$index.1
			}
			{
				source	micsel.$index.1
				sink	src.$index.1
			}
		]
	}

	direction	"capture"
	dynamic_pipeline 1
	period		1000
	time_domain	"timer"
}
