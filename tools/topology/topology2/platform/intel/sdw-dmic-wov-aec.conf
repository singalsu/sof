#
# WebRTC AEC for the single-slot SoundWire DMIC Wake-on-Voice.
#
# module-copier.41.0 (SDW DMIC, 48 kHz stereo) -> micsel.116.1 -> src.116.1 ->
#       webrtc-aec.116.1 pin 0 -> kpb.116.1
# speaker echo reference siggen.120.1 (48 kHz stereo) -> micsel.120.1 ->
#       src.120.1 (48 -> 16 kHz) -> webrtc-aec.116.1 pin 1
#
# Included from sdw-dmic-wov-single.conf when SDW_DMIC_WOV_AEC is true. The
# speaker echo reference (SDW_SPK_ECHO_REF) and its DAI (SDW_ECHO_REF_DAI) must
# be enabled.

Object.Pipeline."siggen-micsel-src-capture" [
	{
		index	$SDW_SPK_ECHO_REF_PIPELINE_ID

		Object.Widget.micsel.1 {
			Object.Control.bytes."1" {
				name "AEC reference micsel bytes"
				<include/components/micsel/downmix_stereo_to_mono.conf>
			}
		}
	}
]

Object.Pipeline."micsel-src-kpb-capture" [
	{
		index	$WOV_KPB_PIPELINE_ID

		Object.Widget.micsel.1 {
			Object.Control.bytes."1" {
				name "SDW DMIC WoV Micsel bytes"
				<include/components/micsel/downmix_stereo_to_mono.conf>
			}
		}

		Object.Widget.kpb.1 {
			history_depth_ms $KPB_BUFF_TIME_MS

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "module-copier.$WOV_SLOT0_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "wov-arbiter.$WOV_ARB_PIPELINE_ID.1"
			}
		}

		Object.Widget.pipeline.1 {
			core_id	$WOV_CORE_ID
		}
	}
]

# The formats are set here since inside a pipeline object they would not
# override the webrtc-aec class defaults.
Object.Widget.webrtc-aec.1 {
	index		$WOV_KPB_PIPELINE_ID

	Object.Control {
		mixer."1" {
			name "AEC switch"
		}
		mixer."2" {
			name "AEC high suppression switch"
		}
	}

	Object.Base.input_pin_binding.1 {
		input_pin_binding_name "src.$WOV_KPB_PIPELINE_ID.1"
	}
	Object.Base.input_pin_binding.2 {
		input_pin_binding_name "src.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}

	# 10 ms buffers to match the AEC processing block size
	Object.Base.input_audio_format [
		{
			input_pin_index		0
			in_rate			16000
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
			in_bit_depth		32
			in_valid_bit_depth	32
			ibs			640
		}
		{
			input_pin_index		1
			in_rate			16000
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
			in_bit_depth		32
			in_valid_bit_depth	32
			ibs			640
		}
	]
	Object.Base.output_audio_format [
		{
			out_rate		16000
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
			out_bit_depth		32
			out_valid_bit_depth	32
			obs			640
		}
	]
}

Object.Base.route [
	{
		source	"alh-copier.Loopback_Virtual.25"
		sink	"siggen.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source	"module-copier.21.22"
		sink	"siggen.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source	"module-copier.$SDW_DMIC_MODULE_COPIER_ID.0"
		sink	"micsel.$WOV_KPB_PIPELINE_ID.1"
	}
	{
		source	"src.$WOV_KPB_PIPELINE_ID.1"
		sink	"webrtc-aec.$WOV_KPB_PIPELINE_ID.1"
	}
	{
		source	"src.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
		sink	"webrtc-aec.$WOV_KPB_PIPELINE_ID.1"
	}
	{
		source	"webrtc-aec.$WOV_KPB_PIPELINE_ID.1"
		sink	"kpb.$WOV_KPB_PIPELINE_ID.1"
	}
]
